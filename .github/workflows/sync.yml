name: 🔄 Auto Sync All Branches from Upstream

on:
  schedule:
    - cron: '0 */6 * * *' # 每 6 小时运行一次
  workflow_dispatch:     # 允许手动触发

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout destination repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 🔄 Sync all branches except this one
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git remote add upstream https://github.com/MetaCubeX/meta-rules-dat.git
          git fetch upstream --prune
          
          # 过滤掉远程主机名本身的干扰
          git for-each-ref refs/remotes/upstream/ --format='%(refname:short)' | grep -v 'upstream$' | while read -r remote_branch; do
            local_branch="${remote_branch#upstream/}"
            
            # 🛡️ 核心安全锁：同时排除 actions-sync 分支 和 你的 custom 分支
            if [ "$local_branch" != "actions-sync" ] && [ "$local_branch" != "custom" ]; then
              echo "Syncing $remote_branch to $local_branch..."
              git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git "refs/remotes/upstream/$local_branch:refs/heads/$local_branch" --force
            else
              echo "🛡️ Skipped protected branch: $local_branch"
            fi
          done
